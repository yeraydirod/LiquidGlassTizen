[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lgtizen"
dynamic = ["version"]
description = "Quita los anuncios de tu tele Samsung (Tizen) e instala una pantalla de inicio limpia, desde tu ordenador."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yeray Díaz Rguez" }, { name = "Hamza El Alaoui (AeroTizen)" }]
requires-python = ">=3.10"
dependencies = ["websocket-client>=1.6", "cryptography>=41", "truststore>=0.9", "certifi"]
keywords = ["samsung", "tizen", "smart-tv", "launcher", "debloat", "sdb"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "lxml>=5"]

[project.scripts]
lgtizen = "lgtizen.cli:main"
lgtizen-inspect = "lgtizen.inspect_app:main"

[tool.setuptools.dynamic]
version = { attr = "lgtizen.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lgtizen = ["ca/*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -W error"
